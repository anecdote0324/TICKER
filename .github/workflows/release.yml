name: Release

# Windows·Mac(Apple Silicon) 설치 파일을 만들어 릴리스로 올려요(01 설치 파일과 서명).
# - Actions → Release → Run workflow에서 종류만 고르면, 지난 태그를 보고 다음 번호를 자동으로 정해 그 태그를 만들면서 올려요.
#   미리 보기: 0.1.0-beta.2 → 0.1.0-beta.3 / 정식: 0.1.0-beta.3 → 0.1.0 / 다음 단계: 0.1.x → 0.2.0-beta.1
# - 버전 태그(v0.1.0 등)를 직접 올려도 돼요. 앱 버전 번호는 태그에서 가져와요(v0.1.0 → 0.1.0).
# - -가 붙은 미리 보기는 바로 공개하고, 정식 버전은 초안으로 올려 확인한 뒤 공개해요.
# - 릴리스를 초안으로 먼저 만들고, 빌드마다 설치 파일을 그 초안에 바로 올려요. Actions의 중간 저장(artifact)은 비공개 저장소의
#   무료 저장 공간(500MB)을 한 번에 약 380MB씩 써서, 하루에 두 번째 릴리스부터 "Artifact storage quota has been hit"으로
#   실패했어요(v0.1.0-beta.10). 릴리스에 붙인 파일은 그 공간을 쓰지 않아요.
# 개인용이라 코드 서명은 하지 않고, 자동 업데이트도 넣지 않아요.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      kind:
        description: '올릴 버전 종류. 번호는 지난 태그를 보고 자동으로 정해요'
        type: choice
        options:
          - '미리 보기 (다음 beta 번호)'
          - '정식'
          - '다음 단계 (가운데 숫자)'
          - '설치 파일만 (릴리스 안 올림)'
        default: '미리 보기 (다음 beta 번호)'
      tag:
        description: '번호를 직접 정할 때만(예: v0.1.0-beta.5). 비우면 위 종류로 자동'
        required: false
        default: ''

permissions:
  contents: write

# 두 번 눌러도 같은 번호를 두 번 만들지 않게 차례로 실행해요
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # 번호는 한 곳에서 한 번만 정해요
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
      tag: ${{ steps.ver.outputs.tag }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      # 태그 형식이 틀리면 여기서 바로 멈춰요
      - name: 버전 번호 정하기
        id: ver
        env:
          TAG: ${{ inputs.tag }}
          BUMP: ${{ inputs.kind }}
        run: node scripts/release-version.mjs "$TAG"

  # 릴리스 초안을 먼저 만들어요. 같은 번호의 초안이 남아 있으면(지난 실행이 중간에 실패) 그 초안을 다시 써요
  draft:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: 릴리스 초안 만들기
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "이미 있는 $TAG 릴리스(초안)에 올려요"
            # 공개할 때 태그가 이 커밋에 생기게 대상을 지금 커밋으로 옮겨요(지난 실행이 고치기 전 커밋으로 만든 초안일 수 있어요)
            gh release edit "$TAG" --target "$GITHUB_SHA"
          else
            # 태그가 없으면(직접 실행) 공개할 때 이 커밋에 만들어요. 지난 릴리스와의 변경 비교 링크를 붙여요
            gh release create "$TAG" --draft --title "$TAG" --target "$GITHUB_SHA" --generate-notes ${{ needs.version.outputs.prerelease == 'true' && '--prerelease' || '' }}
          fi

  build:
    needs: [version, draft]
    # 설치 파일만 만들 때는 초안 작업을 건너뛰어요
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.draft.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      # 첫 실행 때 인터넷이 없어도 종목 검색이 되게 종목 목록 사본을 넣어요(05 §6.1). 저장소에는 올리지 않아요.
      # 빌드 서버에서 마스터 서버에 닿지 않아도 릴리스는 막지 않아요(사본 없이도 앱은 동작해요)
      - run: pnpm snapshot
        continue-on-error: true
      # Windows의 PowerShell은 -c.extraMetadata.version 같은 인자를 점에서 나눌 수 있어서 bash로 실행해요
      - run: pnpm --filter @bt/desktop exec electron-builder --publish never "-c.extraMetadata.version=${{ needs.version.outputs.version }}"
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # 설치 파일을 릴리스 초안에 바로 올려요(같은 이름이면 덮어써요)
      - name: 설치 파일을 릴리스 초안에 올리기
        if: needs.version.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          shopt -s nullglob
          files=(apps/desktop/release/*.exe apps/desktop/release/*.dmg)
          if [ ${#files[@]} -eq 0 ]; then echo "설치 파일이 없어요"; exit 1; fi
          printf '%s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber
      # 설치 파일만 만들 때(릴리스 안 올림)는 실행 화면에서 내려받게 중간 저장에 하루만 남겨요
      - uses: actions/upload-artifact@v4
        if: needs.version.outputs.publish != 'true'
        with:
          name: terminal-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
          if-no-files-found: error
          retention-days: 1

  # 두 OS의 설치 파일이 다 올라갔으면 공개해요(하나라도 실패하면 초안으로 남고, 다시 실행하면 그 초안에 이어서 올려요)
  release:
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: 올라간 설치 파일 확인
        run: |
          names=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "$names"
          echo "$names" | grep -q '\.exe$' || { echo "Windows 설치 파일이 없어요"; exit 1; }
          echo "$names" | grep -q '\.dmg$' || { echo "Mac 설치 파일이 없어요"; exit 1; }
      # 미리 보기(-가 붙은 태그)는 바로 공개하고, 정식 버전은 초안으로 두고 확인한 뒤 공개해요
      - name: 미리 보기 공개
        if: needs.version.outputs.prerelease == 'true'
        run: gh release edit "$TAG" --draft=false
