# 앱 이름은 TICKER(사용자 결정). appId를 바꿔서 예전 이름(Terminal)으로 설치된 앱과는 따로 설치돼요
appId: local.personal.ticker
productName: TICKER
copyright: 개인용
directories:
  output: release
files:
  - dist/**
  - package.json
extraResources:
  - from: web
    to: web
  # 종목 목록 사본(pnpm snapshot으로 만들어요. 저장소에는 올리지 않아요)
  - from: snapshot
    to: snapshot
asar: true
# 자동 업데이트는 넣지 않아요(01). 업데이트 정보 파일(app-update.yml, latest.yml)도 만들지 않아요
publish: null
# 앱 아이콘: 캔들 세 개(사용자 결정). build/make-icons.cjs로 icon.svg·icon-small.svg에서 만들어요
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 예전 버전 제거가 막혀도 덮어 설치(build/installer.nsh)
  include: build/installer.nsh
mac:
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.finance
  # 개인용이라 코드 서명은 하지 않아요(01 설치 파일과 서명)
  identity: null
