<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- 작은 크기(16·24·32px)용 A안: 그림자 없이. 십자로 나눈 판 + 왼쪽 아래 T 타일(작은 크기라 조금 크게) -->
  <defs>
    <clipPath id="board"><rect x="300" y="40" width="704" height="944" rx="120"/></clipPath>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3f434c"/><stop offset="1" stop-color="#101216"/></linearGradient>
  </defs>
  <g clip-path="url(#board)">
    <rect x="300" y="40" width="352" height="472" fill="#ffbf55"/>
    <rect x="652" y="40" width="352" height="472" fill="#ffd27a"/>
    <rect x="300" y="512" width="352" height="472" fill="#ee7d14"/>
