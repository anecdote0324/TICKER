<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- 작은 크기(16·24·32px)용 A안: 그림자 없이. 네 칸 트리맵 판 + 왼쪽 아래 T 타일(작은 크기라 조금 크게) -->
  <defs>
    
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d414a"/><stop offset="1" stop-color="#111317"/></linearGradient>
    
    <clipPath id="board"><rect x="300" y="40" width="704" height="944" rx="120"/></clipPath>
  </defs>
  <!-- 뒤 판: 크기가 제각각인 칸(트리맵) -->
  <g>
    <g clip-path="url(#board)">
      <rect x="300" y="40" width="320" height="520" fill="#ffb444"/>
    <rect x="620" y="40" width="384" height="420" fill="#ffd27a"/>
    <rect x="300" y="560" width="320" height="424" fill="#ee7d14"/>
    <rect x="620" y="460" width="384" height="524" fill="#f9961f"/>
      <g fill="none" stroke="#6b2a00" stroke-opacity="0.35" stroke-width="22">
        <rect x="300" y="40" width="320" height="520"/>
        <rect x="620" y="40" width="384" height="420"/>
        <rect x="300" y="560" width="320" height="424"/>
        <rect x="620" y="460" width="384" height="524"/>
      </g>
    </g>
    
  </g>
  <!-- 앞 타일과 T -->
  <g>
    <rect x="20" y="364" width="580" height="580" rx="110" fill="url(#front)"/>
    
  </g>
  <path d="M140 484 H480 V576 H356 V824 H264 V576 H140 Z" fill="#ffffff"/>
</svg>
