<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- 작은 크기(16·24·32px)용: 여백 없이 꽉 차게, 캔들을 굵게. 큰 아이콘과 같은 색 흐름(입체감은 그라데이션만) -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#3a3d45"/>
      <stop offset="1" stop-color="#0b0c0f"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c3c8d0"/>
    </linearGradient>
    <linearGradient id="grey" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b3b8c2"/>
      <stop offset="1" stop-color="#6c717b"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffbe5c"/>
      <stop offset="1" stop-color="#ef7a12"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="220" fill="url(#tile)"/>
  <rect x="226" y="490" width="38" height="410" rx="19" fill="#dfe2e7"/>
  <rect x="150" y="560" width="190" height="270" rx="36" fill="url(#white)"/>
  <rect x="493" y="350" width="38" height="440" rx="19" fill="#8b919c"/>
  <rect x="417" y="420" width="190" height="300" rx="36" fill="url(#grey)"/>
  <rect x="760" y="130" width="38" height="560" rx="19" fill="#ff9a2e"/>
  <rect x="684" y="210" width="190" height="400" rx="36" fill="url(#amber)"/>
</svg>
