<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- TICKER 앱 아이콘(입체형): 깊이감 있는 어두운 타일 위에 흰색·회색·주황으로 올라가는 캔들 세 개 -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#34373f"/>
      <stop offset="0.55" stop-color="#16181d"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.68" cy="0.42" r="0.42">
      <stop offset="0" stop-color="#ff9a2e" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff9a2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e9ecf1"/>
      <stop offset="1" stop-color="#aeb4bf"/>
    </linearGradient>
    <linearGradient id="grey" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9bec8"/>
      <stop offset="0.55" stop-color="#8b919c"/>
      <stop offset="1" stop-color="#5c616b"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc061"/>
      <stop offset="0.5" stop-color="#ff9a2e"/>
      <stop offset="1" stop-color="#e06a0c"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="candleShadow" x="-60%" y="-20%" width="220%" height="150%">
      <feDropShadow dx="10" dy="22" stdDeviation="14" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="96" y="80" width="832" height="832" rx="200"/>
    </clipPath>
  </defs>

  <!-- 타일: 그림자, 바탕, 위쪽 반사, 테두리 빛 -->
  <rect x="96" y="80" width="832" height="832" rx="200" fill="url(#tile)" filter="url(#tileShadow)"/>
  <g clip-path="url(#tileClip)">
    <rect x="96" y="80" width="832" height="832" fill="url(#glow)"/>
    <!-- 바닥 격자선: 차트 느낌 -->
    <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="4">
      <line x1="96" y1="330" x2="928" y2="330"/>
      <line x1="96" y1="500" x2="928" y2="500"/>
      <line x1="96" y1="670" x2="928" y2="670"/>
    </g>
    <path d="M96 80 H928 V420 C700 360 330 360 96 470 Z" fill="url(#gloss)"/>
  </g>
  <rect x="99" y="83" width="826" height="826" rx="197" fill="none" stroke="url(#rim)" stroke-width="6"/>

  <!-- 캔들 세 개(왼쪽부터 흰색·회색·주황, 오른쪽으로 갈수록 높게) -->
  <g filter="url(#candleShadow)" transform="translate(512 513) scale(1.14) translate(-512 -513)">
    <rect x="331" y="470" width="18" height="320" rx="9" fill="#d9dde4"/>
    <rect x="282" y="525" width="116" height="215" rx="22" fill="url(#white)"/>
    <rect x="296" y="535" width="30" height="190" rx="15" fill="url(#shine)"/>

    <rect x="503" y="380" width="18" height="350" rx="9" fill="#8b919c"/>
    <rect x="454" y="432" width="116" height="248" rx="22" fill="url(#grey)"/>
    <rect x="468" y="442" width="30" height="222" rx="15" fill="url(#shine)" opacity="0.7"/>

    <rect x="675" y="236" width="18" height="434" rx="9" fill="#ff9a2e"/>
    <rect x="626" y="290" width="116" height="330" rx="22" fill="url(#amber)"/>
    <rect x="640" y="300" width="30" height="304" rx="15" fill="url(#shine)"/>
  </g>
</svg>
